name: city-events

services:
  postgres:
    image: postgis/postgis:17-3.5
    # The upstream PostGIS image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-city_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-city_events_local}
      POSTGRES_USER: ${POSTGRES_USER:-city_events}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1'"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
